<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Product | PrintWave</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --pw-black: #151515;
        --pw-yellow: #ffb914;
        --pw-gray: #777;
        --pw-border: #e5e5e5;
      }

      body {
        font-family: "Inter", sans-serif;

        color: var(--pw-black);
      }

      .main-navbar {
        background: var(--pw-black);

        min-height: 88px;
      }

      .navbar-brand img {
        height: 62px;
      }

      .navbar-nav .nav-link {
        color: white;

        padding: 30px 15px !important;
      }

      .navbar-nav .nav-link:hover {
        color: var(--pw-yellow);
      }

      .nav-actions {
        display: flex;

        gap: 22px;

        margin-left: auto;
      }

      .nav-action {
        color: white;

        font-size: 22px;

        position: relative;
      }

      .cart-count {
        position: absolute;

        top: -9px;

        right: -10px;

        width: 18px;

        height: 18px;

        background: var(--pw-yellow);

        color: black;

        border-radius: 50%;

        font-size: 10px;

        font-weight: 800;

        display: flex;

        justify-content: center;

        align-items: center;
      }

      .product-page {
        padding: 65px 0 90px;
      }

      .product-main-image {
        background: #f5f5f5;

        border-radius: 16px;

        overflow: hidden;
      }

      .product-main-image img {
        width: 100%;

        height: 550px;

        object-fit: cover;
      }

      .product-category {
        color: #999;

        font-size: 12px;

        font-weight: 700;

        text-transform: uppercase;

        letter-spacing: 1px;
      }

      .product-title {
        font-size: 42px;

        font-weight: 800;

        margin: 12px 0;
      }

      .product-rating i {
        color: #eaa500;
      }

      .product-price {
        font-size: 28px;

        font-weight: 800;

        margin: 20px 0;
      }

      .old-price {
        color: #aaa;

        font-size: 16px;

        text-decoration: line-through;

        margin-left: 8px;
      }

      .product-description {
        color: var(--pw-gray);

        line-height: 1.8;

        margin-bottom: 25px;
      }

      .option-title {
        font-size: 13px;

        font-weight: 700;

        margin-bottom: 10px;
      }

      .size-btn {
        border: 1px solid var(--pw-border);

        background: white;

        padding: 10px 17px;

        border-radius: 7px;

        margin-right: 7px;

        font-size: 13px;

        font-weight: 600;
      }

      .size-btn.active,
      .size-btn:hover {
        background: var(--pw-black);

        color: white;

        border-color: var(--pw-black);
      }

      .color-btn {
        border: 1px solid var(--pw-border);

        background: white;

        padding: 9px 16px;

        border-radius: 7px;

        margin-right: 7px;

        font-size: 13px;
      }

      .quantity {
        display: flex;

        align-items: center;

        border: 1px solid var(--pw-border);

        border-radius: 8px;

        width: fit-content;
      }

      .quantity button {
        border: none;

        background: transparent;

        width: 40px;

        height: 40px;
      }

      .quantity span {
        min-width: 30px;

        text-align: center;

        font-weight: 700;
      }

      .btn-custom {
        background: var(--pw-yellow);

        border: none;

        border-radius: 50px;

        padding: 15px 28px;

        font-weight: 800;
      }

      .btn-custom:hover {
        background: #e8a500;
      }

      .customize-btn {
        border: 2px solid var(--pw-black);

        background: white;

        color: var(--pw-black);

        border-radius: 50px;

        padding: 13px 28px;

        font-weight: 800;
      }

      @media (max-width: 767px) {
        .product-title {
          font-size: 32px;
        }

        .product-main-image img {
          height: 400px;
        }
      }
    </style>
  </head>

  <body>
    <!-- NAVBAR -->

    <nav class="navbar navbar-expand-lg main-navbar">
      <div class="container">
        <a class="navbar-brand" href="../index.html">
          <img src="../assets/images/logo.png" alt="PrintWave" />
        </a>

        <button
          class="navbar-toggler"
          data-bs-toggle="collapse"
          data-bs-target="#mainNav"
        >
          <i class="bi bi-list text-white fs-2"></i>
        </button>

        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav me-auto">
            <li class="nav-item">
              <a class="nav-link" href="../index.html"> Home </a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="shop.html"> Shop </a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="custom-design.html"> Custom Design </a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="about.html"> About </a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="contact.html"> Contact </a>
            </li>
          </ul>

          <div class="nav-actions">
            <a href="search.html" class="nav-action">
              <i class="bi bi-search"></i>
            </a>

            <a href="cart.html" class="nav-action">
              <i class="bi bi-cart3"></i>

              <span class="cart-count"> 0 </span>
            </a>

            <a href="account.html" class="nav-action">
              <i class="bi bi-person"></i>
            </a>
          </div>
        </div>
      </div>
    </nav>

    <!-- PRODUCT -->

    <section class="product-page">
      <div class="container">
        <div id="productContainer">
          <!-- Loaded dynamically -->
        </div>
      </div>
    </section>

    <!-- JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="assets/js/products.js"></script>

    <script>
      document.addEventListener("DOMContentLoaded", loadProduct);

      function loadProduct() {
        const params = new URLSearchParams(window.location.search);

        const id = Number(params.get("id"));

        const product = products.find((item) => item.id === id);

        const container = document.getElementById("productContainer");

        if (!product) {
          container.innerHTML = `

            <div class="text-center py-5">

                <h2>
                    Product Not Found
                </h2>

                <a
                    href="shop.html"
                    class="btn btn-dark mt-3">

                    Back to Shop

                </a>

            </div>

        `;

          return;
        }

        const stars =
          "★".repeat(product.rating) + "☆".repeat(5 - product.rating);

        const sizes = product.sizes
          .map(
            (size, index) => `

                <button
                    class="size-btn ${index === 0 ? "active" : ""}"
                    onclick="selectSize(this)">

                    ${size}

                </button>

            `,
          )
          .join("");

        const colors = product.colors
          .map(
            (color, index) => `

                <button
                    class="color-btn ${index === 0 ? "active" : ""}"
                    onclick="selectColor(this)">

                    ${color}

                </button>

            `,
          )
          .join("");

        container.innerHTML = `

        <div class="row g-5 align-items-start">


            <div class="col-lg-6">

                <div class="product-main-image">

                    <img
                        src="${product.image}"
                        alt="${product.name}">

                </div>

            </div>


            <div class="col-lg-6">

                <div class="product-category">

                    ${product.category}

                </div>


                <h1 class="product-title">

                    ${product.name}

                </h1>


                <div class="product-rating">

                    ${stars}

                    <span class="text-muted ms-2">

                        ${product.reviews} Reviews

                    </span>

                </div>


                <div class="product-price">

                    ₹${product.price}

                    ${
                      product.oldPrice
                        ? `
                            <span class="old-price">
                                ₹${product.oldPrice}
                            </span>
                          `
                        : ""
                    }

                </div>


                <p class="product-description">

                    ${product.description}

                </p>


                <div class="mb-4">

                    <div class="option-title">
                        Select Size
                    </div>

                    ${sizes}

                </div>


                <div class="mb-4">

                    <div class="option-title">
                        Select Color
                    </div>

                    ${colors}

                </div>


                <div class="d-flex gap-3 flex-wrap">

                    <div class="quantity">

                        <button
                            onclick="changeQuantity(-1)">

                            −

                        </button>


                        <span id="quantity">
                            1
                        </span>


                        <button
                            onclick="changeQuantity(1)">

                            +

                        </button>

                    </div>


                    <button
                        class="btn-custom"
                        onclick="addProductToCart(${product.id})">

                        <i class="bi bi-cart-plus me-2"></i>

                        Add to Cart

                    </button>

                </div>


                ${
                  product.customizable
                    ? `
                        <div class="mt-4">

                            <button
                                class="customize-btn"
                                onclick="customizeProduct(${product.id})">

                                <i class="bi bi-pencil-square me-2"></i>

                                Customize This Product

                            </button>

                        </div>
                      `
                    : ""
                }


                <hr class="my-4">


                <div class="text-muted small">

                    <div class="mb-2">

                        <i class="bi bi-truck me-2"></i>

                        Fast delivery

                    </div>


                    <div class="mb-2">

                        <i class="bi bi-shield-check me-2"></i>

                        Quality assured

                    </div>


                    <div>

                        <i class="bi bi-arrow-repeat me-2"></i>

                        Easy support

                    </div>

                </div>

            </div>

        </div>

    `;
      }

      function selectSize(button) {
        document
          .querySelectorAll(".size-btn")
          .forEach((btn) => btn.classList.remove("active"));

        button.classList.add("active");
      }

      function selectColor(button) {
        document
          .querySelectorAll(".color-btn")
          .forEach((btn) => btn.classList.remove("active"));

        button.classList.add("active");
      }

      function changeQuantity(amount) {
        const element = document.getElementById("quantity");

        let quantity = Number(element.textContent);

        quantity += amount;

        if (quantity < 1) {
          quantity = 1;
        }

        element.textContent = quantity;
      }

      function addProductToCart(id) {
        const product = products.find((item) => item.id === id);

        if (!product) return;

        const quantity = Number(
          document.getElementById("quantity").textContent,
        );

        let cart = JSON.parse(localStorage.getItem("printwaveCart")) || [];

        const selectedSize = document
          .querySelector(".size-btn.active")
          ?.textContent.trim();

        const selectedColor = document
          .querySelector(".color-btn.active")
          ?.textContent.trim();

        const existing = cart.find(
          (item) =>
            item.id === id &&
            item.size === selectedSize &&
            item.color === selectedColor,
        );

        if (existing) {
          existing.quantity += quantity;
        } else {
          cart.push({
            id: product.id,

            name: product.name,

            price: product.price,

            image: product.image,

            quantity: quantity,

            size: selectedSize,

            color: selectedColor,
          });
        }

        localStorage.setItem("printwaveCart", JSON.stringify(cart));

        updateCartCount();

        alert("Product added to cart!");
      }

      function updateCartCount() {
        const cart = JSON.parse(localStorage.getItem("printwaveCart")) || [];

        const count = cart.reduce((total, item) => total + item.quantity, 0);

        document.querySelectorAll(".cart-count").forEach((element) => {
          element.textContent = count;
        });
      }

      function customizeProduct(id) {
        window.location.href = `custom-design.html?product=${id}`;
      }

      updateCartCount();
    </script>
  </body>
</html>
