<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Login | PrintWave</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <!-- Admin Login CSS -->
    <link
        rel="stylesheet"
        href="../assets/css/admin-login.css"
    >

</head>


<body>


<!-- =====================================================
     ADMIN LOGIN PAGE
===================================================== -->

<main class="admin-login-page">


    <!-- Background Decoration -->

    <div class="login-decoration decoration-one"></div>
    <div class="login-decoration decoration-two"></div>


    <div class="admin-login-container">


        <!-- =================================================
             BRAND
        ================================================== -->

        <div class="admin-login-brand">

            <a href="../index.html">

                <img
                    src="../assets/images/printwave-logo.png"
                    alt="PrintWave"
                >

            </a>

            <div class="admin-login-label">

                <span>
                    ADMIN PANEL
                </span>

            </div>

        </div>


        <!-- =================================================
             LOGIN CARD
        ================================================== -->

        <div class="admin-login-card">


            <div class="admin-login-header">

                <div class="admin-login-icon">

                    <i class="bi bi-shield-lock"></i>

                </div>


                <h1>
                    Admin Login
                </h1>


                <p>
                    Sign in to manage your PrintWave store.
                </p>

            </div>


            <!-- Error / Success Message -->

            <div
                id="loginMessage"
                class="login-message"
                role="alert"
            ></div>


            <!-- =================================================
                 LOGIN FORM
            ================================================== -->

            <form
                id="adminLoginForm"
                novalidate
            >


                <!-- Email -->

                <div class="login-field">

                    <label for="adminEmail">
                        Email Address
                    </label>

                    <div class="input-wrapper">

                        <i class="bi bi-envelope"></i>

                        <input
                            type="email"
                            id="adminEmail"
                            name="email"
                            placeholder="admin@printwave.in"
                            autocomplete="username"
                            required
                        >

                    </div>

                </div>


                <!-- Password -->

                <div class="login-field">

                    <label for="adminPassword">
                        Password
                    </label>

                    <div class="input-wrapper">

                        <i class="bi bi-lock"></i>

                        <input
                            type="password"
                            id="adminPassword"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            id="passwordToggle"
                            aria-label="Show password"
                        >
                            <i class="bi bi-eye"></i>
                        </button>

                    </div>

                </div>


                <!-- Remember -->

                <div class="login-options">

                    <label class="remember-me">

                        <input
                            type="checkbox"
                            id="rememberAdmin"
                        >

                        <span>
                            Remember me
                        </span>

                    </label>


                    <button
                        type="button"
                        id="forgotPasswordBtn"
                        class="forgot-password"
                    >
                        Forgot password?
                    </button>

                </div>


                <!-- Login Button -->

                <button
                    type="submit"
                    class="admin-login-btn"
                    id="adminLoginBtn"
                >

                    <span
                        id="loginButtonText"
                    >
                        Sign In
                    </span>

                    <span
                        id="loginSpinner"
                        class="login-spinner"
                    >
                        <i class="bi bi-arrow-repeat"></i>
                    </span>

                </button>


            </form>


            <!-- =================================================
                 DEMO INFORMATION
            ================================================== -->

            <div class="demo-admin-box">

                <div class="demo-admin-title">

                    <i class="bi bi-info-circle"></i>

                    Demo Admin Access

                </div>

                <div class="demo-admin-details">

                    <div>
                        <span>
                            Email
                        </span>

                        <strong>
                            admin@printwave.in
                        </strong>
                    </div>

                    <div>
                        <span>
                            Password
                        </span>

                        <strong>
                            Admin@123
                        </strong>
                    </div>

                </div>

            </div>


            <!-- Back to Store -->

            <div class="back-to-store">

                <a href="../index.html">

                    <i class="bi bi-arrow-left"></i>

                    Back to PrintWave Store

                </a>

            </div>

        </div>


        <!-- =================================================
             FOOTER
        ================================================== -->

        <div class="admin-login-footer">

            <span>
                © <span id="loginFooterYear"></span> PrintWave
            </span>

            <span>
                Secure Admin Area
            </span>

        </div>


    </div>

</main>


<!-- =====================================================
     ADMIN LOGIN JS
===================================================== -->

<script src="../assets/js/admin-login.js"></script>

</body>

</html>
